# Tier-1 CI: every PR and every push to main (BUILD_HANDOFF §1.4, COMP-REPO).
# Hard rules: no secrets are used by this workflow; no job prints screenshot content.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned scanner; bump deliberately. Matches the builder's local install.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  js:
    name: js (lint, typecheck, jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: app.config.ts imports a .ts sibling via Node type stripping (needs >=22.18); matches eas.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      # The shared contracts round trip (npm test) shells out to the pydantic models.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shared/python/pyproject.toml
      - name: Install shared contracts (python)
        run: python -m pip install -e ./shared/python
      - run: npm ci
      - name: Generated contracts match shared/schema (drift check)
        run: npm run check:generated -w @penciled/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    # Server tests run against real Postgres (SPR-04). Throwaway CI database: trust auth,
    # no password, nothing secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: penciled_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/penciled_test
      PENCILED_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            shared/python/pyproject.toml
      # The shared contracts round trip (pytest) shells out to the zod schemas.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Install server and shared contracts with dev deps
        run: python -m pip install -e "./server[dev]" -e "./shared/python[dev]"
      - name: ruff
        run: |
          ruff check server
          ruff check tools/ci
          ruff check shared/python
      - name: mypy (shared contracts)
        working-directory: shared/python
        run: mypy
      - name: mypy
        working-directory: server
        run: mypy app
      - name: alembic migrations apply to Postgres (CLI path used by the deploy)
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/penciled_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: pytest
        run: python -m pytest server/tests tools/ci/tests shared

  server-image:
    name: server image (docker build, non-root, health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f server/Dockerfile -t penciled-api:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm penciled-api:ci id -u)" != "0"
      - name: Health responds without a database
        run: |
          set -euo pipefail
          docker run -d --name api -p 8080:8080 penciled-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Planted fake key is blocked
        run: python tools/ci/test_secret_scan.py

  no-content-log:
    name: no-content-log grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/ci/no_content_log.py
