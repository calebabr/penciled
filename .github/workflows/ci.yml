# Tier-1 CI: every PR and every push to main (BUILD_HANDOFF §1.4, COMP-REPO).
# Hard rules: no secrets are used by this workflow; no job prints screenshot content.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned scanner; bump deliberately. Matches the builder's local install.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  js:
    name: js (lint, typecheck, jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: app.config.ts imports a .ts sibling via Node type stripping (needs >=22.18); matches eas.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install server with dev deps
        run: python -m pip install -e "./server[dev]"
      - name: ruff
        run: |
          ruff check server
          ruff check tools/ci
      - name: mypy
        working-directory: server
        run: mypy app
      - name: pytest
        run: python -m pytest server/tests tools/ci/tests

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Planted fake key is blocked
        run: python tools/ci/test_secret_scan.py

  no-content-log:
    name: no-content-log grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/ci/no_content_log.py
