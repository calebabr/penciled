# Fly.io app config for the Penciled API (beta: exactly one warm machine).
# Deploy from the repo root:  fly deploy --config server/fly.toml --dockerfile server/Dockerfile .
# Secrets are set with `fly secrets set` (see server/DEPLOY.md), never in this file.
app = "penciled-api"          # placeholder: replace with the name you create
primary_region = "ord"        # placeholder: pick the region nearest your testers and your Postgres

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Schema migrations run once per release, in a temporary machine with the app's secrets.
  release_command = "alembic upgrade head"

[env]
  PORT = "8080"
  PENCILED_MIN_APP_VERSION = "0.1.0"

[http_service]
  internal_port = 8080
  force_https = true
  # One warm instance: no scale-to-zero cold start (SPR-04 risk: 10 s SLO).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/v1/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
