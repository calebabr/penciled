[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "penciled-server"
version = "0.1.0"
description = "Penciled API server (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    # Shared contracts v1 (shared/python); installed from the repo path, see STATUS.md.
    "penciled-contracts>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.json", "db/migrations/*.mako"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
# The shared contracts are an editable install (import hook mypy cannot follow).
mypy_path = "../shared/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
